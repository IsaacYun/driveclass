<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>데모 설정 팝업</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pleos/tokens.css">
<link rel="stylesheet" href="ds/pleos/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="pl-root" style="position: relative; width: 1700px; height: 1210px; overflow: hidden; font-family: var(--font-sans); color: var(--text_dark_primary);">
  <dc-import name="Main" hint-size="1700px,1210px"></dc-import>
  <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--overlay_default);">
    <div class="pl-popup" role="dialog" aria-labelledby="demo-title" style="width: 880px; text-align: left; gap: var(--space_24);">
      <h2 id="demo-title" class="pl-popup__title" style="text-align: center;">데모 설정</h2>
      <p class="pl-popup__desc" style="text-align: center;">시연용 값이에요. 실제 차에서는 내비와 차량 신호가 대신 넣어요.</p>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 96px; box-shadow: inset 0 -2px 0 var(--basic_alpha_dark_100);">
        <span style="font: var(--text-body_large);">주행 중</span>
        <button class="pl-switch" type="button" role="switch" aria-checked="false" aria-label="주행 중"></button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 16px; padding: 16px 0; box-shadow: inset 0 -2px 0 var(--basic_alpha_dark_100);">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font: var(--text-body_large);">남은 주행 시간</span>
          <span style="font: var(--text-title_small); font-variant-numeric: tabular-nums;">32분</span>
        </div>
        <div class="pl-slider">
          <div class="pl-slider__track" role="slider" aria-label="남은 주행 시간" aria-valuemin="0" aria-valuemax="120" aria-valuenow="32"><div class="pl-slider__fill" style="width: 27%;"></div></div>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 80px;">
        <span style="font: var(--text-body_medium); color: var(--text_dark_secondary);">내비 연동</span>
        <span style="font: var(--text-body_medium); font-weight: 700; color: var(--informative_positive);">경로 안내 중 · 남은 시간 받는 중</span>
      </div>
      <div class="pl-popup__actions" style="margin-top: 8px;">
        <button class="pl-btn pl-btn--secondary pl-press" type="button">완료</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1700,"height":1210}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
